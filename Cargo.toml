[workspace]
resolver = "2"
members = ["crates/*", "bindings/node"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NomaDamas/im-not-llm"
authors = ["NomaDamas"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
candle-core = "0.11.0"
candle-nn = "0.11.0"
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq", "rustls-tls"] }
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "signal"] }
tracing = "0.1"

# candle-core 0.11.0 does not compile on rustc 1.93 aarch64: neon.rs uses
# float16x8_t which now requires the unstable stdarch_neon_f16 feature.
# huggingface/candle#3845 gates those types behind target_feature="fp16".
[patch.crates-io]
candle-core = { git = "https://github.com/huggingface/candle", rev = "7b59bb97817beb527a1afcf9c11cd4aff1898bc2" }
candle-nn = { git = "https://github.com/huggingface/candle", rev = "7b59bb97817beb527a1afcf9c11cd4aff1898bc2" }
candle-metal-kernels = { git = "https://github.com/huggingface/candle", rev = "7b59bb97817beb527a1afcf9c11cd4aff1898bc2" }
