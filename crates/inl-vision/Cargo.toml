[package]
name = "inl-vision"
description = "Multimodal embedding (image, video, audio) with EmbeddingGemma 2 on candle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
cuda = ["inl-core/cuda", "inl-text/cuda"]
cudnn = ["inl-core/cudnn", "inl-text/cudnn"]
accelerate = ["inl-core/accelerate", "inl-text/accelerate"]
mkl = ["inl-core/mkl", "inl-text/mkl"]

[dependencies]
inl-core = { path = "../inl-core" }
inl-text = { path = "../inl-text" }
async-trait.workspace = true
base64.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
serde.workspace = true
serde_json.workspace = true
tokenizers.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
