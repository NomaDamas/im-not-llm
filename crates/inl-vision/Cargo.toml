[package]
name = "inl-vision"
description = "Multimodal embedding (image, video, audio) with EmbeddingGemma 2 on candle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
cuda = ["inl-core/cuda", "inl-text/cuda"]
cudnn = ["inl-core/cudnn", "inl-text/cudnn"]
accelerate = ["inl-core/accelerate", "inl-text/accelerate"]
mkl = ["inl-core/mkl", "inl-text/mkl"]

[dependencies]
inl-core.workspace = true
inl-text.workspace = true
async-trait.workspace = true
base64.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
candle-core.workspace = true
candle-nn.workspace = true
rustfft = "6.4"
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokenizers.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
