[package]
name = "inl-server"
description = "Loopback HTTP daemon and lifecycle API for im-not-llm engines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
cuda = ["inl-core/cuda"]
cudnn = ["inl-core/cudnn"]
accelerate = ["inl-core/accelerate"]
mkl = ["inl-core/mkl"]

[dependencies]
inl-core = { path = "../inl-core" }
inl-text = { path = "../inl-text" }
inl-sparse = { path = "../inl-sparse" }
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true

[[bin]]
name = "inl"
path = "src/bin/inl.rs"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
