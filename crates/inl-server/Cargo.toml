[package]
name = "inl-server"
description = "Loopback HTTP daemon and lifecycle API for im-not-llm engines"
version = "0.3.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["cli"]
# The `inl` binary: it names the concrete engine crates. The library alone
# (`default-features = false`) only needs the engine traits, so a host that
# brings its own engines (a text-only indexer) does not link the vision stack.
cli = ["dep:clap", "dep:inl-text", "dep:inl-vision", "dep:inl-ane", "dep:mimalloc", "dep:libmimalloc-sys"]
cuda = ["inl-core/cuda", "inl-sparse/cuda", "inl-late/cuda", "inl-text?/cuda", "inl-vision?/cuda"]
cudnn = ["inl-core/cudnn", "inl-sparse/cudnn", "inl-late/cudnn", "inl-text?/cudnn", "inl-vision?/cudnn"]
accelerate = ["inl-core/accelerate", "inl-sparse/accelerate", "inl-late/accelerate", "inl-text?/accelerate", "inl-vision?/accelerate"]
mkl = ["inl-core/mkl", "inl-sparse/mkl", "inl-late/mkl", "inl-text?/mkl", "inl-vision?/mkl"]

[dependencies]
inl-core.workspace = true
inl-text = { workspace = true, optional = true }
inl-late.workspace = true
inl-sparse.workspace = true
inl-vision = { workspace = true, optional = true }
inl-ane = { workspace = true, optional = true }
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
clap = { version = "4", features = ["derive"], optional = true }
fs2 = "0.4"
http-body-util = "0.1"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true

# The `inl` binary allocates with mimalloc on macOS, where the system allocator
# keeps the memory of a large request resident (see `src/bin/inl.rs`).
[target.'cfg(target_os = "macos")'.dependencies]
mimalloc = { version = "0.1", default-features = false, optional = true }
libmimalloc-sys = { version = "0.1", default-features = false, features = ["extended"], optional = true }

[[bin]]
name = "inl"
path = "src/bin/inl.rs"
required-features = ["cli"]

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
